<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#17111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pomodoro 3D" />
  <meta name="description" content="A tactile mechanical Pomodoro timer that works offline and installs on Android." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.svg" />
  <title>Pomodoro 3D</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./mechanical.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">MECHANICAL FOCUS TIMER</div>
        <h1>Pomodoro <span>3D</span></h1>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="icon-btn install hidden" aria-label="Install app" title="Install app">⇩</button>
        <button id="settingsBtn" class="icon-btn" aria-label="Open settings" title="Settings">⚙</button>
      </div>
    </header>

    <section class="mode-tabs" aria-label="Timer mode">
      <button class="mode active" data-mode="focus">Focus</button>
      <button class="mode" data-mode="short">Short break</button>
      <button class="mode" data-mode="long">Long break</button>
    </section>

    <section class="scene" id="scene" aria-label="Mechanical 3D pomodoro timer">
      <div class="floor-shadow"></div>
      <div class="timer-object" id="timerObject">
        <div class="lower-shell" aria-hidden="true">
          <div class="lower-highlight"></div>
          <div class="lower-shadow"></div>
          <div id="timeDisplay" class="embedded-time">25:00</div>
        </div>

        <div id="mechanicalTop" class="mechanical-top" aria-hidden="true">
          <div class="upper-shell">
            <div class="upper-surface-highlight"></div>
            <div class="upper-side-shade"></div>
          </div>
          <div class="leaf leaf-a"></div>
          <div class="leaf leaf-b"></div>
          <div class="leaf leaf-c"></div>
          <div class="leaf leaf-d"></div>
          <div class="stem-core"></div>
          <div class="scale-window">
            <div id="scaleTrack" class="scale-track"></div>
          </div>
        </div>

        <div class="body-index" aria-hidden="true"><span></span></div>
        <button id="dial" class="top-drag-surface" aria-label="Hold the upper half and drag left or right to set minutes" title="Hold the upper half and twist left or right"></button>
        <div class="base-ring" aria-hidden="true"><div class="base-glow"></div></div>
      </div>
      <div class="hint" id="dialHint">Hold the upper half and drag left / right</div>
      <div id="mechanicalStatus" class="mechanical-status" aria-live="polite">Ready</div>
    </section>

    <section class="controls" aria-label="Timer controls">
      <button id="resetBtn" class="secondary-btn" aria-label="Reset timer">↺</button>
      <button id="startBtn" class="primary-btn"><span id="startIcon">▶</span><span id="startText">Start</span></button>
      <button id="skipBtn" class="secondary-btn" aria-label="Skip session">⏭</button>
    </section>

    <section class="cycle-card">
      <div class="cycle-heading">
        <span id="sessionText">Session 1 of 4</span>
        <button id="soundQuickBtn" class="text-btn" aria-label="Toggle sounds">Sound on</button>
      </div>
      <div id="cycleDots" class="cycle-dots"></div>
    </section>

    <section class="stats-grid">
      <article><strong id="completedToday">0</strong><span>Focus sessions today</span></article>
      <article><strong id="focusMinutes">0</strong><span>Focus minutes today</span></article>
    </section>
  </main>

  <div id="scrim" class="scrim hidden"></div>
  <aside id="settingsPanel" class="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div><div class="eyebrow">CUSTOMIZE</div><h2>Timer settings</h2></div>
      <button id="closeSettings" class="icon-btn" aria-label="Close settings">✕</button>
    </div>

    <div class="settings-scroll">
      <section class="setting-group">
        <h3>Durations</h3>
        <div class="number-row"><label for="focusMinutesInput">Focus</label><div><input id="focusMinutesInput" type="number" min="1" max="60" inputmode="numeric"><span>min</span></div></div>
        <div class="number-row"><label for="shortMinutesInput">Short break</label><div><input id="shortMinutesInput" type="number" min="1" max="60" inputmode="numeric"><span>min</span></div></div>
        <div class="number-row"><label for="longMinutesInput">Long break</label><div><input id="longMinutesInput" type="number" min="1" max="60" inputmode="numeric"><span>min</span></div></div>
        <div class="number-row"><label for="sessionsInput">Long break after</label><div><input id="sessionsInput" type="number" min="1" max="12" inputmode="numeric"><span>focus</span></div></div>
      </section>

      <section class="setting-group">
        <h3>Automation</h3>
        <label class="switch-row"><span><b>Auto-start breaks</b><small>Begin the next break automatically</small></span><input id="autoBreakInput" type="checkbox"><i></i></label>
        <label class="switch-row"><span><b>Auto-start focus</b><small>Begin focus after a break automatically</small></span><input id="autoFocusInput" type="checkbox"><i></i></label>
        <label class="switch-row"><span><b>Keep screen awake</b><small>Keep the display awake while running</small></span><input id="wakeInput" type="checkbox"><i></i></label>
      </section>

      <section class="setting-group">
        <h3>Mechanical sound</h3>
        <label class="switch-row"><span><b>Sounds</b><small>Ratchet while turning and bell at zero</small></span><input id="soundInput" type="checkbox"><i></i></label>
        <label class="switch-row"><span><b>Tick while running</b><small>Mechanical one-second ticking</small></span><input id="tickInput" type="checkbox"><i></i></label>
        <label class="switch-row"><span><b>Vibration</b><small>Small haptic clicks while turning</small></span><input id="vibrateInput" type="checkbox"><i></i></label>
        <button id="notificationBtn" class="wide-action">Enable notifications</button>
      </section>

      <section class="setting-group">
        <h3>Appearance</h3>
        <label class="switch-row"><span><b>3D motion</b><small>Subtle depth while the upper half turns</small></span><input id="motionInput" type="checkbox"><i></i></label>
      </section>

      <section class="setting-group danger-zone">
        <button id="resetStatsBtn" class="wide-action muted">Reset today's statistics</button>
      </section>
      <div class="safe-space"></div>
    </div>
  </aside>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
